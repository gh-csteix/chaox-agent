name = "chaox-agent-worker"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "chaox-agent"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "../server/migrations"

# Set two separate bearer tokens as Wrangler secrets before deploying (or run `npm run setup`):
# npx wrangler secret put CHAOX_SYNC_TOKEN
# npx wrangler secret put CHAOX_MCP_TOKEN
